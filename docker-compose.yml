services:
  postgres:
    image: postgres:15-alpine
    container_name: strapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - stuk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    build:
      context: ./strapi-website
      dockerfile: Dockerfile
    container_name: strapi-app
    restart: unless-stopped
    command: npm run develop
    environment:
      HOST: ${HOST}
      PORT: ${PORT}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: postgres
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: ${DATABASE_SSL}
      NODE_ENV: development
    volumes:
      - ./strapi-website/config:/opt/app/config
      - ./strapi-website/src:/opt/app/src
      - ./strapi-website/package.json:/opt/app/package.json
      - ./strapi-website/public/uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - stuk-network
    depends_on:
      postgres:
        condition: service_healthy

  nuxt:
    build:
      context: ./stuk-nuxt-app
      dockerfile: Dockerfile
    container_name: nuxt-app
    restart: unless-stopped
    environment:
      STRAPI_URL: http://strapi:1337
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./stuk-nuxt-app:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "3000:3000"
      - "24678:24678"
    networks:
      - stuk-network
    depends_on:
      - strapi

volumes:
  postgres-data:

networks:
  stuk-network:
    driver: bridge
