services:
  postgres:
    image: postgres:15-alpine
    container_name: strapi-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - stuk-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    build:
      context: ./strapi-website
      dockerfile: Dockerfile.dev
    container_name: strapi-app-dev
    restart: unless-stopped
    environment:
      HOST: ${HOST}
      PORT: ${PORT}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: ${DATABASE_SSL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
    volumes:
      - ./strapi-website/config:/opt/app/config
      - ./strapi-website/src:/opt/app/src
      - ./strapi-website/package.json:/opt/app/package.json
      - ./strapi-website/public/uploads:/opt/app/public/uploads
    ports:
      - "1338:1337"
    networks:
      - stuk-network-dev
    depends_on:
      postgres:
        condition: service_healthy

  nuxt:
    build:
      context: ./stuk-nuxt-app
      dockerfile: Dockerfile.dev
    container_name: nuxt-app-dev
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_STRAPI_URL: https://dev.stuk-leipzig.de
      NUXT_STRAPI_URL_SERVER: http://strapi:1337
      NUXT_INVENTUR_PIN: ${NUXT_INVENTUR_PIN}
      NUXT_INVENTUR_API_TOKEN: ${NUXT_INVENTUR_API_TOKEN}
      EMAIL_STRAPI_TOKEN: ${EMAIL_STRAPI_TOKEN}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./stuk-nuxt-app:/app
      - /app/node_modules
    ports:
      - "3001:3000"
      - "24679:24678"
    networks:
      - stuk-network-dev
    depends_on:
      - strapi

  caddy:
    image: caddy:2-alpine
    container_name: caddy-dev
    restart: unless-stopped
    ports:
      - "3002:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      - stuk-network-dev
    depends_on:
      - nuxt
      - strapi

volumes:
  postgres-data-dev:

networks:
  stuk-network-dev:
    driver: bridge
